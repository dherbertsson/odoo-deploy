apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.credentialsSecretStatic.name }}
  namespace: {{ .Release.Namespace }}
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: infisical
  syncOptions:
    refreshInterval: 1m
    instantUpdates: false
  sources:
    - projectSlug: {{ required "projectSlug is a required value!" .Values.credentialsSecretStatic.source.projectSlug }}
      environmentSlug: {{ required "environmentSlug is a required value!" .Values.credentialsSecretStatic.source.environmentSlug }}
      secretPath: {{ required "secretPath is a required value!" .Values.credentialsSecretStatic.source.secretPath }}
  targets:
    - name: {{ .Values.global.postgres.credentialsSecretManaged }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          username: '{{ "{{" }} secretFrom "/postgres" "username" {{ "}}" }}'
          password: '{{ "{{" }} secretFrom "/postgres" "password" {{ "}}" }}'